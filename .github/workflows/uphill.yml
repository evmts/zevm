name: Uphill

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.15.2"

      - name: Run Uphill
        uses: wevm/uphill@main
