name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual qualification must not cancel the push check required for publishing.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.2"

jobs:
  fast:
    name: Build, Test, And Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ZEVM
        uses: actions/checkout@v7
        with:
          path: zevm

      - name: Checkout execution-apis and ethereum-tests fixtures
        working-directory: zevm
        run: git submodule update --init --depth 1 -- lib/execution-apis lib/ethereum-tests

      - name: Checkout pinned native dependencies
        working-directory: zevm
        run: bash tools/checkout-native.sh

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cargo perl rustc

      - name: Install npm package dependencies
        working-directory: zevm
        run: npm --prefix npm/zevm install --ignore-scripts

      - name: Fetch Zig package dependencies
        working-directory: zevm
        run: zig build --fetch

      - name: Verify package dependency pins
        working-directory: zevm
        run: zig build dependency-preflight -- --zig-version "$ZIG_VERSION"

      - name: Build
        working-directory: zevm
        run: zig build

      - name: Fast verification
        working-directory: zevm
        run: zig build verify-fast

      - name: Ethereum TransactionTests
        working-directory: zevm
        run: zig build transaction-tests

      - name: Ethereum DifficultyTests
        working-directory: zevm
        run: zig build difficulty-tests

      - name: Ethereum EOFTests
        working-directory: zevm
        run: zig build eof-tests

      - name: Ethereum BlockchainTests
        working-directory: zevm
        run: zig build blockchain-tests -- --summary-only

      - name: Build the pinned Lean 4 reference spec
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: zevm/spec/lean
          auto-config: "false"
          build: "true"
          build-args: "--wfail ZevmSpec zevm-spec"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Check the Lean reference spec for sorry and axiom declarations
        working-directory: zevm/spec/lean
        run: |
          audit_dir="$(mktemp -d "$RUNNER_TEMP/zevm-lean.XXXXXXXX")"
          cat > "$audit_dir/Audit.lean" <<'LEAN'
          import Lean
          import ZevmSpec

          open Lean Elab Command

          run_cmd do
            let env ← getEnv
            for (name, info) in env.constants do
              let some idx := env.getModuleIdxFor? name | continue
              unless (`ZevmSpec).isPrefixOf env.header.moduleNames[idx.toNat]! do continue
              if let .axiomInfo _ := info then
                throwError "reference spec declares axiom {name}"
              if info.type.hasSorry || (info.value? (allowOpaque := true)).any Expr.hasSorry then
                throwError "reference spec declaration {name} uses sorry"
          LEAN
          lake env lean "$audit_dir/Audit.lean"

      - name: Differential fuzzing against the Lean spec
        working-directory: zevm
        run: |
          # Local setup with Lean installed: (cd spec/lean && lake build --wfail ZevmSpec zevm-spec)
          zig build diff-fuzz-lean -Doptimize=ReleaseSafe -- \
            --lean-bin spec/lean/.lake/build/bin/zevm-spec --cases 128

      - name: C ABI smoke
        working-directory: zevm
        run: zig build c-smoke

      - name: N-API smoke
        working-directory: zevm
        run: zig build npm-smoke

      - name: Release binary artifact smoke
        working-directory: zevm
        run: zig build release-binaries -Doptimize=ReleaseSafe

      - name: NPM native artifact smoke
        working-directory: zevm
        run: zig build npm-platform-artifacts -Doptimize=ReleaseSafe

      - name: Browser WASM execution
        working-directory: zevm
        run: |
          rustup target add wasm32-unknown-unknown
          zig build wasm
          node npm/zevm/scripts/browser-smoke.mjs
          node npm/zevm/scripts/chromium-smoke.mjs

      - name: JavaScript package and factory checks
        working-directory: zevm
        run: |
          node --check npm/zevm/src/index.js
          npm --prefix npm/zevm run build
          node tools/docs_mirror.mjs
          node tools/generate_llms_txt.mjs --check
          node tools/wiki_sync.mjs --check
          node .smithers/playground/csp.mjs --check
          node npm/zevm/scripts/verify-release.cjs
          node --test tools/audit_report.test.mjs tools/wiki_sync.test.mjs tools/sandbox_auth.test.mjs tools/generate_llms_txt.test.mjs

      - name: Qualification map structural check
        working-directory: zevm
        run: zig build qualification-check

      - name: Release metadata smoke generation
        working-directory: zevm
        run: |
          zig build release-metadata -- \
            --out-dir zig-out/release/ci \
            --release-identifier "commit-$(git rev-parse HEAD)"
          test -s zig-out/release/ci/release-tuple.json
          test -s zig-out/release/ci/light-default-checkpoints.json
          test "$(jq -r '.zevmGitRevision' zig-out/release/ci/release-tuple.json)" = "$(git rev-parse HEAD)"
          test "$(jq -r '.voltaireGitRevision' zig-out/release/ci/release-tuple.json)" = "$(jq -r '.voltaire.revision' native-dependencies.json)"
          test "$(jq -r '.guillotineMiniGitRevision' zig-out/release/ci/release-tuple.json)" = "$(jq -r '."guillotine-mini".revision' native-dependencies.json)"
          test "$(jq -r '.zigVersion' zig-out/release/ci/release-tuple.json)" = "$ZIG_VERSION"
          EXPECTED_HOODI="0x$(sed -n 's/^pub const hoodi_hex = "\(.*\)";$/\1/p' src/light_default_checkpoints.zig)"
          jq -e --arg expected "$EXPECTED_HOODI" '
            .defaults.hoodi | test("^0x[0-9a-fA-F]{64}$") and . == $expected
          ' zig-out/release/ci/light-default-checkpoints.json > /dev/null

      - name: Dirty worktree preflight
        working-directory: zevm
        run: git diff --exit-code -- .

  smithers:
    name: smthrs ci //...
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SMTHRS_VERSION: "1.0.0-rc.18"
    steps:
      - name: Checkout ZEVM
        uses: actions/checkout@v7
        with:
          path: zevm
          persist-credentials: false

      - name: Checkout execution-apis test fixtures
        working-directory: zevm
        run: git submodule update --init --depth 1 -- lib/execution-apis

      - name: Checkout pinned native dependencies
        working-directory: zevm
        run: bash tools/checkout-native.sh

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cargo perl rustc

      - name: Restore Smithers local cache
        uses: actions/cache@v4
        with:
          path: zevm/.smithers/cache
          key: smithers-${{ runner.os }}-${{ github.sha }}
          restore-keys: smithers-${{ runner.os }}-

      - name: Fetch Zig package dependencies
        working-directory: zevm
        run: zig build --fetch

      - name: Digest pinned native dependencies
        working-directory: zevm
        run: node tools/native_deps_digest.mjs .native-deps.digest

      # Pull requests read the shared remote cache under an isolated PR namespace;
      # pushes to main also publish to the shared Smithers Cloud object store.
      - name: smthrs ci //...
        working-directory: zevm
        run: npx --yes --package=@smthrs/cli@"$SMTHRS_VERSION" smthrs ci '//...' --workspace . --verbose
        env:
          SMITHERS_TRUST: ${{ github.event_name == 'pull_request' && 'untrusted' || 'controlled-sandbox' }}
          SMITHERS_CACHE_NAMESPACE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_WRITE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SMITHERS_CACHE_WRITE_TOKEN || '' }}

      - name: Dirty worktree preflight
        working-directory: zevm
        run: git diff --exit-code -- .

  fuzz:
    name: Coverage-Guided Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout ZEVM
        uses: actions/checkout@v7
        with:
          path: zevm

      - name: Checkout execution-apis test fixtures
        working-directory: zevm
        run: git submodule update --init --depth 1 -- lib/execution-apis

      - name: Checkout pinned native dependencies
        working-directory: zevm
        run: bash tools/checkout-native.sh

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cargo perl rustc

      - name: Fetch Zig package dependencies
        working-directory: zevm
        run: zig build --fetch

      - name: Run coverage-guided Zig fuzzing campaign
        working-directory: zevm
        run: bash tools/fuzz_ubuntu.sh --local --optimize ReleaseSafe --seconds 15 --jobs 4

      - name: Dirty worktree preflight
        working-directory: zevm
        run: git diff --exit-code -- .

  external:
    name: Official External Verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout ZEVM
        uses: actions/checkout@v7
        with:
          path: zevm
          submodules: recursive

      - name: Checkout pinned native dependencies
        working-directory: zevm
        run: bash tools/checkout-native.sh

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cargo perl rustc

      - name: Fetch Zig package dependencies
        working-directory: zevm
        run: zig build --fetch

      - name: Early-fork state tests
        working-directory: zevm
        run: |
          bash tools/fetch-early-state.sh
          zig build verify-early-state -Doptimize=ReleaseSafe

      - name: Berlin and Shanghai state tests
        working-directory: zevm
        run: zig build verify-mid-forks

      - name: Verify release qualification coverage
        working-directory: zevm
        run: zig build qualification-check -- --require-covered

      - name: External verification
        working-directory: zevm
        run: zig build verify

      - name: Latest-fork state tests (Cancun and Prague)
        working-directory: zevm
        run: zig build verify-latest-state -Doptimize=ReleaseFast

      - name: Dirty worktree preflight
        working-directory: zevm
        run: git diff --exit-code -- .

  hive-smoke:
    name: Hive RPC Compat Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout ZEVM
        uses: actions/checkout@v7
        with:
          path: zevm
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: zevm/lib/hive/go.sum

      - name: Hive rpc-compat smoke
        working-directory: zevm
        run: &hive_smoke |
          # Expose the pins to the source image while preserving the root allowlist.
          source_ignore=tools/hive/zevm-client/Dockerfile.source.dockerignore
          cp .dockerignore "$source_ignore"
          trap 'rm -f "$source_ignore"' EXIT
          printf '\n!native-dependencies.json\n' >> "$source_ignore"
          bun tools/hive_rpc_compat_smoke.js

      - name: Preserve failed Hive transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hive-rpc-compat-failure
          path: zevm/zig-out/hive/logs
          retention-days: 7

      - name: Dirty worktree preflight
        working-directory: zevm
        run: git diff --exit-code -- .

  release-assets:
    name: Published Release Asset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'release'
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_IDENTIFIER: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout ZEVM release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: zevm
          submodules: recursive

      - name: Checkout pinned native dependencies
        working-directory: zevm
        run: bash tools/checkout-native.sh

      - name: Download required release metadata assets
        working-directory: zevm
        run: |
          mkdir -p .ops/release-metadata/"$RELEASE_IDENTIFIER"
          ASSET_NAMES_JSON="$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_IDENTIFIER" --jq '[.assets[].name]')"
          RELEASE_TUPLE_COUNT="$(printf '%s' "$ASSET_NAMES_JSON" | jq '[.[] | select(. == "release-tuple.json")] | length')"
          LIGHT_DEFAULTS_COUNT="$(printf '%s' "$ASSET_NAMES_JSON" | jq '[.[] | select(. == "light-default-checkpoints.json")] | length')"
          test "$RELEASE_TUPLE_COUNT" -eq 1
          test "$LIGHT_DEFAULTS_COUNT" -eq 1
          gh release download "$RELEASE_IDENTIFIER" \
            --repo "${{ github.repository }}" \
            --pattern "release-tuple.json" \
            --pattern "light-default-checkpoints.json" \
            --dir .ops/release-metadata/"$RELEASE_IDENTIFIER"

      - name: Validate release metadata contracts
        working-directory: zevm
        run: |
          ARTIFACT_DIR=.ops/release-metadata/"$RELEASE_IDENTIFIER"
          jq -e --arg rid "$RELEASE_IDENTIFIER" --arg zevm_head "$(git rev-parse HEAD)" '
            (type == "object")
            and ((keys | sort) == [
              "guillotineMiniGitRevision",
              "releaseIdentifier",
              "schemaVersion",
              "voltaireGitRevision",
              "zevmGitRevision",
              "zigVersion"
            ])
            and (.schemaVersion == "zevm-release-tuple.v1")
            and (.releaseIdentifier == $rid)
            and (.zevmGitRevision == $zevm_head)
            and (.zevmGitRevision | test("^[0-9a-fA-F]{40}$"))
            and (.voltaireGitRevision | test("^[0-9a-fA-F]{40}$"))
            and (.guillotineMiniGitRevision | test("^[0-9a-fA-F]{40}$"))
            and (.zigVersion | type == "string" and length > 0)
          ' "$ARTIFACT_DIR/release-tuple.json" > /dev/null
          EXPECTED_MAINNET="0x$(sed -n 's/^pub const mainnet_hex = "\(.*\)";$/\1/p' src/light_default_checkpoints.zig)"
          EXPECTED_SEPOLIA="0x$(sed -n 's/^pub const sepolia_hex = "\(.*\)";$/\1/p' src/light_default_checkpoints.zig)"
          EXPECTED_HOLESKY="0x$(sed -n 's/^pub const holesky_hex = "\(.*\)";$/\1/p' src/light_default_checkpoints.zig)"
          EXPECTED_HOODI="0x$(sed -n 's/^pub const hoodi_hex = "\(.*\)";$/\1/p' src/light_default_checkpoints.zig)"
          jq -e \
            --arg rid "$RELEASE_IDENTIFIER" \
            --arg expected_mainnet "$EXPECTED_MAINNET" \
            --arg expected_sepolia "$EXPECTED_SEPOLIA" \
            --arg expected_holesky "$EXPECTED_HOLESKY" \
            --arg expected_hoodi "$EXPECTED_HOODI" '
            (type == "object")
            and ((keys | sort) == ["defaults", "releaseIdentifier", "schemaVersion"])
            and (.schemaVersion == "zevm-light-default-checkpoints.v1")
            and (.releaseIdentifier == $rid)
            and (.defaults | type == "object")
            and ((.defaults | keys | sort) == ["holesky", "hoodi", "mainnet", "sepolia"])
            and (.defaults.mainnet | test("^0x[0-9a-fA-F]{64}$"))
            and (.defaults.sepolia | test("^0x[0-9a-fA-F]{64}$"))
            and (.defaults.holesky | test("^0x[0-9a-fA-F]{64}$"))
            and (.defaults.hoodi | test("^0x[0-9a-fA-F]{64}$"))
            and (.defaults.mainnet == $expected_mainnet)
            and (.defaults.sepolia == $expected_sepolia)
            and (.defaults.holesky == $expected_holesky)
            and (.defaults.hoodi == $expected_hoodi)
          ' "$ARTIFACT_DIR/light-default-checkpoints.json" > /dev/null

      - name: Extract release tuple pins
        id: release_tuple
        working-directory: zevm
        run: |
          ARTIFACT_DIR=.ops/release-metadata/"$RELEASE_IDENTIFIER"
          {
            echo "zevm_revision=$(jq -r '.zevmGitRevision' "$ARTIFACT_DIR/release-tuple.json")"
            echo "voltaire_revision=$(jq -r '.voltaireGitRevision' "$ARTIFACT_DIR/release-tuple.json")"
            echo "guillotine_mini_revision=$(jq -r '.guillotineMiniGitRevision' "$ARTIFACT_DIR/release-tuple.json")"
            echo "zig_version=$(jq -r '.zigVersion' "$ARTIFACT_DIR/release-tuple.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up tuple Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ steps.release_tuple.outputs.zig_version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: zevm/lib/hive/go.sum

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cargo perl rustc

      - name: Verify materialized release tuple
        working-directory: zevm
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.release_tuple.outputs.zevm_revision }}"
          test "$(zig version)" = "${{ steps.release_tuple.outputs.zig_version }}"
          zig build --fetch
          zig build dependency-preflight -- \
            --zig-version "${{ steps.release_tuple.outputs.zig_version }}" \
            --voltaire-revision "${{ steps.release_tuple.outputs.voltaire_revision }}" \
            --guillotine-mini-revision "${{ steps.release_tuple.outputs.guillotine_mini_revision }}"
          zig build verify
          zig build qualification-check -- --require-covered

      - name: Hive rpc-compat smoke against materialized tuple
        working-directory: zevm
        run: *hive_smoke

      - name: Dirty worktree preflight
        working-directory: zevm
        run: git diff --exit-code -- .
