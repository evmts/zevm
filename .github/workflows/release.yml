name: npm Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarballs from main
        required: true
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: zevm-npm-${{ (github.ref_type == 'tag' || inputs.publish) && 'publish' || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      voltaire: ${{ steps.pins.outputs.voltaire }}
      guillotine: ${{ steps.pins.outputs.guillotine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check version and main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || test "$GITHUB_REF" = refs/heads/main
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$main_sha" = "$GITHUB_SHA"
          node npm/zevm/scripts/verify-release.cjs
      - id: pins
        run: |
          jq -er '"voltaire=" + .voltaire.revision, "guillotine=" + .["guillotine-mini"].revision' native-dependencies.json >> "$GITHUB_OUTPUT"

  native:
    needs: prepare
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15, zig: aarch64-macos, rust: aarch64-apple-darwin }
          - { platform: darwin-x64, runner: macos-15-intel, zig: x86_64-macos, rust: x86_64-apple-darwin }
          - { platform: linux-arm64-gnu, runner: ubuntu-22.04-arm, zig: aarch64-linux-gnu, rust: aarch64-unknown-linux-gnu }
          - { platform: linux-x64-gnu, runner: ubuntu-22.04, zig: x86_64-linux-gnu, rust: x86_64-unknown-linux-gnu }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm, zig: aarch64-linux-musl, rust: aarch64-unknown-linux-musl }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, zig: x86_64-linux-musl, rust: x86_64-unknown-linux-musl }
          - { platform: freebsd-arm64, runner: ubuntu-24.04, zig: aarch64-freebsd, rust: aarch64-unknown-freebsd }
          - { platform: freebsd-x64, runner: ubuntu-24.04, zig: x86_64-freebsd, rust: x86_64-unknown-freebsd }
          - { platform: win32-arm64-msvc, runner: windows-11-arm, zig: aarch64-windows-msvc, rust: aarch64-pc-windows-msvc, node_arch: arm64 }
          - { platform: win32-x64-msvc, runner: windows-2025, zig: x86_64-windows-msvc, rust: x86_64-pc-windows-msvc, node_arch: x64 }
          - { platform: win32-ia32-msvc, runner: windows-2025, zig: x86-windows-msvc, rust: i686-pc-windows-msvc, node_arch: x86 }
    defaults:
      run:
        shell: bash
        working-directory: zevm
    steps:
      - uses: actions/checkout@v7
        if: runner.os != 'Windows'
        with:
          path: zevm
          persist-credentials: false
      - name: Extract Windows-compatible build sources at the release SHA
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          # Git for Windows rejects the deployment state's names even with a sparse checkout.
          mkdir zevm
          curl --retry 3 -fsSL "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o zevm-source.tgz
          tar -xzf zevm-source.tgz -C zevm --strip-components=1 --exclude='*/cloudflare' --exclude='*/cloudflare/*'
          test -f zevm/build.zig
      - uses: actions/checkout@v7
        with:
          repository: evmts/voltaire
          ref: ${{ needs.prepare.outputs.voltaire }}
          path: voltaire
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: evmts/guillotine-mini
          ref: ${{ needs.prepare.outputs.guillotine }}
          path: guillotine-mini
          persist-credentials: false
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
      - name: Install Rust target
        run: rustup target add "${{ matrix.rust }}"
      - name: Install Node import library
        if: runner.os == 'Windows'
        env:
          NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          version=$(node -p process.version)
          dir=win-$NODE_ARCH
          mkdir -p "$dir"
          url=https://nodejs.org/dist/$version
          curl -fsSLo "$dir/node.lib" "$url/$dir/node.lib"
          curl -fsSL "$url/SHASUMS256.txt" | awk -v lib="$dir/node.lib" '$2 == lib {print}' > node-lib.sha256
          sha256sum -c node-lib.sha256
          echo "ZEVM_NODE_IMPORT_LIB=$(cygpath -w "$PWD/$dir/node.lib")" >> "$GITHUB_ENV"
      - name: Build addon
        run: zig build npm-platform-artifacts -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig }}
      - name: Execute native smoke
        if: "!startsWith(matrix.platform, 'freebsd-') && !endsWith(matrix.platform, '-musl')"
        run: |
          addon=zig-out/npm/prebuilds/${{ matrix.platform }}/zevm.node
          node npm/zevm/scripts/smoke.cjs "$addon"
          node npm/zevm/scripts/execution-smoke.cjs "$addon"
      - name: Execute musl smoke
        if: endsWith(matrix.platform, '-musl')
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work node:22-alpine node npm/zevm/scripts/execution-smoke.cjs zig-out/npm/prebuilds/${{ matrix.platform }}/zevm.node
      - name: Execute FreeBSD smoke
        if: startsWith(matrix.platform, 'freebsd-')
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: "14.5"
          arch: ${{ matrix.platform == 'freebsd-arm64' && 'aarch64' || 'x86_64' }}
          sync: nfs
          prepare: pkg install -y node22
          run: |
            set -eu
            cd zevm
            addon=zig-out/npm/prebuilds/${{ matrix.platform }}/zevm.node
            node npm/zevm/scripts/smoke.cjs "$addon"
            node npm/zevm/scripts/execution-smoke.cjs "$addon"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: zevm/zig-out/npm/prebuilds/${{ matrix.platform }}/zevm.node
          if-no-files-found: error

  wasm:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: zevm
          persist-credentials: false
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and exercise browser artifact
        working-directory: zevm
        run: |
          bash tools/checkout-native.sh
          rustup target add wasm32-unknown-unknown
          zig build wasm
          npm --prefix npm/zevm run build
          node npm/zevm/scripts/browser-smoke.mjs
          node npm/zevm/scripts/chromium-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: zevm/zig-out/npm/browser/zevm.wasm
          if-no-files-found: error

  pack:
    needs: [native, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: zig-out/npm/prebuilds
      - name: Pack and install all release artifacts
        run: |
          mv zig-out/npm/prebuilds/browser zig-out/npm/browser
          node npm/zevm/scripts/stage-artifacts.cjs
          node npm/zevm/scripts/release-tarballs.cjs pack
          dir=$(mktemp -d)
          npm install --prefix "$dir" --offline --ignore-scripts --no-audit --no-fund zig-out/tarballs/evmts-zevm-0*.tgz zig-out/tarballs/evmts-zevm-linux-x64-gnu-*.tgz
          cd "$dir"
          node --input-type=module -e "import { NativeNode } from '@evmts/zevm'; const n = new NativeNode(); n.close()"
          node --conditions=browser --input-type=module -e "import { createWasmBackend } from '@evmts/zevm'; import {readFile} from 'node:fs/promises'; const n = await createWasmBackend({wasm:await readFile(new URL(import.meta.resolve('@evmts/zevm/zevm.wasm')))}); n.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: zig-out/tarballs/*.tgz
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: zig-out/tarballs
      - name: Require successful main CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          run=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh run watch "$run" --exit-status --interval 30
      - name: Publish platform tarballs then the main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/zevm/scripts/release-tarballs.cjs publish
