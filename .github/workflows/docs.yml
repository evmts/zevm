name: Docs, Wiki & Audit Publish

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"
      - "cloudflare/zevm-docs-worker/**"
      - ".smithers/wiki/**"
      - ".smithers/history/**"
      - ".smithers/HOME.mjs"
      - ".smithers/home.json"
      - ".agents/uphill/**"
      - "tools/generate_llms_txt.mjs"
      - "tools/audit_report.mjs"
      - "tools/wiki_sync.mjs"
      - "tools/home_projection.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zevm-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs, llms.txt & Lighthouse Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.15.2"

      - name: Verify docs mirror, llms.txt, home projection, and Obsidian wiki
        run: |
          node tools/docs_mirror.mjs
          node tools/generate_llms_txt.mjs --check
          node tools/home_projection.mjs --check
          node tools/wiki_sync.mjs --check --out .smithers/reports/wiki-feed.json

      - name: Run Uphill (SHA-pinned)
        uses: wevm/uphill@f71fba4d199409cbc8bf00d713dab4b24d91b980

      - name: Render Lighthouse Audit UI into docs/public/audit/index.html
        env:
          SMITHERS_TRUST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'controlled-sandbox' || 'untrusted' }}
        run: |
          node tools/audit_report.mjs \
            --input .uphill/report.json \
            --out .uphill/audit-report.html \
            --publish-docs docs/public/audit/index.html \
            --feed-out .uphill/factory-feed.json \
            --md-out .uphill/audit-comment.md \
            --trust "${SMITHERS_TRUST}"

      - name: Build Astro Starlight site
        run: |
          npm --prefix docs ci
          npm --prefix docs run build
          test -s docs/dist/llms.txt
          test -s docs/dist/audit/index.html

      - name: Upload built docs and feeds for trunk deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zevm-docs-bundle
          path: |
            docs/dist/
            .uphill/factory-feed.json
            .smithers/reports/wiki-feed.json
          retention-days: 7

  deploy:
    name: Deploy zevm.sh & Sync Smithers Cloud Feeds (trunk)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: trunk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download built docs bundle
        uses: actions/download-artifact@v4
        with:
          name: zevm-docs-bundle
          path: .

      - name: Deploy zevm.sh docs worker (when trunk Cloudflare credentials are configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_CI_STATE_STORE_CHECK: "false"
          ALCHEMY_TELEMETRY_DISABLED: "1"
        working-directory: cloudflare/zevm-docs-worker
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured on trunk environment; skipping live zevm.sh deploy"
            exit 0
          fi
          npm install --no-audit --no-fund
          rm -rf public && mkdir -p public && cp -R ../../docs/dist/. public/
          USER=williamcory npx alchemy deploy

      - name: Sync Obsidian wiki and Backpressure feeds to Smithers Cloud
        env:
          SMITHERS_FEED_KEY: ${{ secrets.SMITHERS_FEED_KEY }}
        run: |
          if [ -z "${SMITHERS_FEED_KEY:-}" ]; then
            echo "SMITHERS_FEED_KEY not configured on trunk environment; skipping live Smithers Cloud feed push"
            exit 0
          fi
          node tools/wiki_sync.mjs --push
          curl -fsSL -X POST "https://smithers.sh/api/repos/evmts/zevm/feeds" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${SMITHERS_FEED_KEY}" \
            --data-binary "@.uphill/factory-feed.json"
