<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-a5JHzi3x+uIaED+3dpGu70bmwfjeWZlCPVz3g/tjy08='; style-src 'sha256-aVizYh4VB1qGhDkFpHkf9uTtN19RnsGXQn7gygHieJ4='; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>ZEVM Execution Workbench</title>
<style>
:root {
  color-scheme: light dark;
  --bg: Canvas;
  --fg: CanvasText;
  --muted: GrayText;
  --accent: #3a756b;
  --accent-hi: #52b7a5;
  --pass: #0cce6b;
  --fail: #ff4e42;
  font: 15px/1.5 system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box }
body { margin: 0; padding: clamp(16px, 3vw, 32px); background: var(--bg); color: var(--fg) }
main { max-width: 820px; margin: auto }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 18px }
h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); line-height: 1.15; letter-spacing: -0.02em }
.tag { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted) }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px }
.preset { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--muted); background: transparent; color: inherit; cursor: pointer }
.preset:hover { border-color: var(--accent-hi) }
.preset.active { background: var(--accent); color: #fff; border-color: var(--accent-hi) }
form, label { display: grid; gap: 8px }
form { gap: 14px; border: 1px solid var(--muted); padding: clamp(14px, 3vw, 22px); border-radius: 12px }
label { font-weight: 600; font-size: 13px }
label.dimmed { opacity: 0.55 }
select, textarea, input, button.primary { font: inherit; color: inherit; padding: 9px 10px; border: 1px solid var(--muted); border-radius: 8px }
select, textarea, input { background: var(--bg); width: 100% }
textarea:disabled, input:disabled { cursor: not-allowed }
textarea, input[type=text], output, td, .stat-val { font-family: ui-monospace, monospace }
textarea { min-height: 76px; resize: vertical }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px }
.actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px }
button.primary { justify-self: start; padding: 9px 20px; font-weight: 700; background: var(--accent); color: #fff; border-color: var(--accent-hi); cursor: pointer }
button.primary:disabled { background: #2d4641; color: #d8ece8; border-color: #466c65; opacity: 1; cursor: not-allowed }
#status a { color: var(--accent-hi); text-decoration: underline }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px }
#status { min-height: 1.4em; margin: 12px 0 0; font-size: 13px; font-family: ui-monospace, monospace; color: var(--muted) }
.summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0 }
.stat { border: 1px solid var(--muted); border-radius: 10px; padding: 10px 12px }
.stat-k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted) }
.stat-val { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; margin-top: 2px }
output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin: 12px 0; padding: 12px; border: 1px solid var(--muted); border-radius: 10px; font-size: 13px }
.table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px }
caption { text-align: left; font-weight: 700; margin: 8px 0; font-size: 13px }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--muted) }
[hidden] { display: none !important }
</style>
</head>
<body>
<main>
<header>
  <h1>ZEVM Execution Workbench</h1>
  <span class="tag">sandboxed native devnet · chain 31337 · max 250k gas</span>
</header>
<div class="presets" role="group" aria-label="Bytecode presets">
  <button class="preset active" type="button" data-preset="return42" aria-pressed="true">Return 42</button>
  <button class="preset" type="button" data-preset="add" aria-pressed="false">ADD 2 + 3</button>
  <button class="preset" type="button" data-preset="keccak" aria-pressed="false">Keccak256</button>
  <button class="preset" type="button" data-preset="revert" aria-pressed="false">Revert Trace</button>
  <button class="preset" type="button" data-preset="chainId" aria-pressed="false">eth_chainId</button>
</div>
<form>
  <div class="controls">
    <label>Operation
      <select id="method" name="method">
        <option value="debug_traceCall">Trace bytecode (debug_traceCall)</option>
        <option value="eth_call">Call bytecode (eth_call)</option>
        <option value="eth_chainId">Chain ID (eth_chainId)</option>
        <option value="eth_blockNumber">Block number (eth_blockNumber)</option>
      </select>
    </label>
    <label>Gas limit
      <input id="gas" name="gas" type="number" value="100000" min="21000" max="250000" required>
    </label>
  </div>
  <label id="bytecodeLabel"><span id="bytecode-label">Runtime bytecode</span>
    <textarea name="bytecode" maxlength="4098" spellcheck="false" autocomplete="off">0x602a60005260206000f3</textarea>
  </label>
  <label id="calldataLabel">Calldata
    <input name="calldata" type="text" value="0x" maxlength="2050" spellcheck="false" autocomplete="off">
  </label>
  <div class="actions">
    <button class="primary" id="runBtn" type="button" disabled>Run in ZEVM Sandbox</button>
    <span class="tag">Runs fresh in-memory NativeNode per request</span>
  </div>
</form>
<p id="status" role="status">Connecting to Smithers...</p>
<section id="result" aria-label="Execution result" hidden>
  <div class="summary-row" id="summaryRow" hidden>
    <div class="stat"><div class="stat-k">Status</div><div class="stat-val" id="statOutcome">-</div></div>
    <div class="stat"><div class="stat-k">Gas Used</div><div class="stat-val" id="statGas">-</div></div>
    <div class="stat"><div class="stat-k">Steps</div><div class="stat-val" id="statSteps">-</div></div>
  </div>
  <output aria-label="Result"></output>
  <div class="table-wrap">
    <table hidden>
      <caption>Opcode trace (first 256 steps)</caption>
      <thead><tr><th scope="col">PC</th><th scope="col">Opcode</th><th scope="col">Gas</th><th scope="col">Cost</th><th scope="col">Depth</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
</main>
<script>
const host = "https://smithers.sh"
const form = document.querySelector("form")
const button = document.querySelector("#runBtn")
const status = document.querySelector("#status")
const result = document.querySelector("#result")
const summaryRow = document.querySelector("#summaryRow")
const statOutcome = document.querySelector("#statOutcome")
const statGas = document.querySelector("#statGas")
const statSteps = document.querySelector("#statSteps")
const output = result.querySelector("output")
const table = result.querySelector("table")
const rows = table.querySelector("tbody")
const nonce = document.documentElement.dataset.smithersNonce
const initId = "playground"
const presets = {
  return42: { method: "debug_traceCall", bytecode: "0x602a60005260206000f3", calldata: "0x", gas: 100000 },
  add: { method: "debug_traceCall", bytecode: "0x600260030160005260206000f3", calldata: "0x", gas: 100000 },
  keccak: { method: "debug_traceCall", bytecode: "0x600060002060005260206000f3", calldata: "0x", gas: 100000 },
  revert: { method: "debug_traceCall", bytecode: "0x60006000fd", calldata: "0x", gas: 100000 },
  chainId: { method: "eth_chainId", bytecode: "0x", calldata: "0x", gas: 100000 }
}
let port
let pending
let nextId = 0

const presetButtons = [...document.querySelectorAll(".preset")]
const bytecodeLabel = document.querySelector("#bytecodeLabel")
const calldataLabel = document.querySelector("#calldataLabel")

function syncMethodFields() {
  const needsCode = form.elements.method.value === "debug_traceCall" || form.elements.method.value === "eth_call"
  form.elements.bytecode.disabled = !needsCode
  form.elements.calldata.disabled = !needsCode
  bytecodeLabel.classList.toggle("dimmed", !needsCode)
  calldataLabel.classList.toggle("dimmed", !needsCode)
}

function setActivePreset(activeEl) {
  for (const el of presetButtons) {
    const on = el === activeEl
    el.classList.toggle("active", on)
    el.setAttribute("aria-pressed", on ? "true" : "false")
  }
}

for (const el of presetButtons) {
  el.addEventListener("click", () => {
    const p = presets[el.dataset.preset]
    if (!p) return
    form.elements.method.value = p.method
    form.elements.bytecode.value = p.bytecode
    form.elements.calldata.value = p.calldata
    form.elements.gas.value = String(p.gas)
    setActivePreset(el)
    syncMethodFields()
  })
}

form.addEventListener("input", () => {
  setActivePreset(null)
  syncMethodFields()
})
form.elements.method.addEventListener("change", () => {
  setActivePreset(null)
  syncMethodFields()
})
syncMethodFields()

function paint(value) {
  const { steps, ...summary } = value
  output.textContent = JSON.stringify(summary, null, 2)
  const list = Array.isArray(steps) ? steps.slice(0, 256) : []
  if (typeof value.gasUsed === "number") {
    statOutcome.textContent = value.failed ? "REVERT" : "OK"
    statGas.textContent = String(value.gasUsed)
    statSteps.textContent = String(list.length) + (value.truncated ? "+" : "")
    summaryRow.hidden = false
  } else {
    summaryRow.hidden = true
  }
  rows.replaceChildren()
  for (const step of list) {
    const row = rows.insertRow()
    for (const key of ["pc", "op", "gas", "gasCost", "depth"]) {
      const cell = row.insertCell()
      const cellVal = step?.[key]
      cell.textContent = typeof cellVal === "number" || typeof cellVal === "string" ? cellVal : ""
    }
  }
  table.hidden = rows.rows.length === 0
  result.hidden = false
}

function receive(event) {
  const reply = event.data
  if (!pending || reply?.jsonrpc !== "2.0" || reply.id !== pending.id) return
  clearTimeout(pending.timer)
  pending = undefined
  button.disabled = false
  if (reply.result && typeof reply.result === "object" && !Array.isArray(reply.result)) {
    if (typeof reply.result.error === "string") {
      status.textContent = reply.result.error.slice(0, 256)
    } else {
      paint(reply.result)
      status.textContent = reply.result.failed ? "Execution reverted" : "Execution complete"
    }
  } else {
    status.textContent = "Execution unavailable"
  }
}

if (parent !== window && /^[A-Za-z0-9_-]{22,128}$/.test(nonce ?? "")) {
  const connectionDeadline = setTimeout(() => {
    status.textContent = "Smithers connection unavailable"
  }, 4000)
  window.addEventListener("message", function initialize(event) {
    const reply = event.data
    if (event.source !== parent || event.origin !== host || reply?.jsonrpc !== "2.0" ||
        reply.id !== initId || reply.result?.flow !== "playground/exec" || event.ports.length !== 1) return
    window.removeEventListener("message", initialize)
    clearTimeout(connectionDeadline)
    port = event.ports[0]
    port.onmessage = receive
    button.disabled = false
    status.textContent = "Ready"
  })
  parent.postMessage({ jsonrpc: "2.0", id: initId, method: "ui/initialize", params: { nonce } }, host)
} else {
  const link = document.createElement("a")
  link.href = "https://smithers.sh/evmts/zevm"
  link.target = "_blank"
  link.rel = "noreferrer"
  link.textContent = "Smithers (smithers.sh/evmts/zevm)"
  status.replaceChildren(
    document.createTextNode("Standalone preview mode. Open from "),
    link,
    document.createTextNode(" to execute requests and inspect live opcode traces.")
  )
}

button.addEventListener("click", (event) => {
  event.preventDefault()
  if (!event.isTrusted || !port || pending) return
  const method = form.elements.method.value
  const needsCode = method === "debug_traceCall" || method === "eth_call"
  const params = {
    method,
    bytecode: needsCode ? form.elements.bytecode.value.trim() : "0x",
    calldata: needsCode ? form.elements.calldata.value.trim() : "0x",
    gas: Number(form.elements.gas.value)
  }
  for (const hex of [params.bytecode, params.calldata]) {
    if (!/^0x(?:[0-9a-f]{2})*$/i.test(hex)) {
      status.textContent = "Enter even-length hex starting with 0x"
      return
    }
  }
  const id = ++nextId
  result.hidden = true
  status.textContent = "Running..."
  button.disabled = true
  const timer = setTimeout(() => {
    pending = undefined
    button.disabled = false
    status.textContent = "Request timed out"
  }, 15000)
  pending = { id, timer }
  port.postMessage({ jsonrpc: "2.0", id, method: "playground/exec", params })
})
</script>
</body>
</html>
